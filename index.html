<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Calorie Calculator — Problem Statement 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .phone-container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 36px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.12), 0 4px 12px rgba(15, 23, 42, 0.06);
      overflow: hidden;
      border: 8px solid #0f172a;
      display: flex;
      flex-direction: column;
    }

    /* Mobile Status Bar Simulation */
    .status-bar {
      height: 32px;
      background: #0f172a;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .content {
      padding: 24px 20px 32px;
      background: #f8fafc;
      flex: 1;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      color: #0f172a;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: #64748b;
      margin-top: 4px;
      line-height: 1.4;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid #e2e8f0;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .input-control {
      width: 100%;
      height: 48px;
      padding: 0 14px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      color: #0f172a;
      background: #f8fafc;
      transition: border-color 0.15s ease;
      outline: none;
    }

    .input-control:focus {
      border-color: #2563eb;
      background: #ffffff;
    }

    select.input-control {
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-primary {
      flex: 1;
      height: 50px;
      background: #2563eb;
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.05s ease;
    }

    .btn-primary:hover {
      background: #1d4ed8;
    }

    .btn-primary:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      height: 50px;
      padding: 0 18px;
      background: #f1f5f9;
      color: #475569;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .error-banner {
      color: #dc2626;
      font-size: 13px;
      font-weight: 500;
      margin-top: 10px;
      display: none;
    }

    /* Result Card */
    .result-card {
      background: #eff6ff;
      border: 1.5px solid #bfdbfe;
      border-radius: 18px;
      padding: 20px;
      display: none;
      animation: fadeIn 0.25s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .result-label {
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .calories-display {
      font-size: 32px;
      font-weight: 800;
      color: #0f172a;
      margin: 6px 0 14px;
    }

    .divider {
      height: 1px;
      background: #bfdbfe;
      margin: 12px 0;
    }

    .category-row {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #475569;
    }

    .category-badge {
      margin-left: 10px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }

    .badge-sedentary {
      background: #e2e8f0;
      color: #475569;
    }

    .badge-moderate {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-very-active {
      background: #d1fae5;
      color: #047857;
    }

    .breakdown-text {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="phone-container">
    <div class="status-bar">
      <span>9:41</span>
      <span>●●● 5G 100%</span>
    </div>

    <div class="content">
      <div class="header">
        <h1>Daily Calorie Calculator</h1>
        <p>Problem Statement 3: Estimate daily calorie requirements based on age, weight, and activity level.</p>
      </div>

      <div class="card">
        <!-- Field 1: Age -->
        <div class="form-group">
          <label for="ageInput">Age (in years)</label>
          <input
            type="number"
            id="ageInput"
            class="input-control"
            placeholder="Enter your age (e.g., 25)"
            min="1"
            max="120"
          />
        </div>

        <!-- Field 2: Weight -->
        <div class="form-group">
          <label for="weightInput">Weight (in kilograms)</label>
          <input
            type="number"
            step="0.1"
            id="weightInput"
            class="input-control"
            placeholder="Enter your weight in kg (e.g., 70.0)"
            min="5"
            max="400"
          />
        </div>

        <!-- Field 3: Activity Level -->
        <div class="form-group">
          <label for="activityInput">Activity Level</label>
          <select id="activityInput" class="input-control">
            <option value="Sedentary">Sedentary</option>
            <option value="Moderately Active" selected>Moderately Active</option>
            <option value="Very Active">Very Active</option>
          </select>
        </div>

        <div class="error-banner" id="errorBanner"></div>

        <div class="btn-row">
          <button class="btn-primary" id="btnCalculate">Calculate Calories</button>
          <button class="btn-secondary" id="btnClear">Clear</button>
        </div>
      </div>

      <!-- Result Card -->
      <div class="result-card" id="resultCard">
        <div class="result-label">Estimated Daily Requirement</div>
        <div class="calories-display" id="calorieText">2,150 kcal / day</div>

        <div class="divider"></div>

        <div class="category-row">
          <span>Activity Category:</span>
          <span class="category-badge badge-moderate" id="badgeCategory">Moderately Active</span>
        </div>

        <div class="breakdown-text" id="breakdownText">
          Estimated BMR: 1,387 kcal • Multiplier: 1.550x
        </div>
      </div>
    </div>
  </div>

  <script>
    const ageInput = document.getElementById("ageInput");
    const weightInput = document.getElementById("weightInput");
    const activityInput = document.getElementById("activityInput");
    const btnCalculate = document.getElementById("btnCalculate");
    const btnClear = document.getElementById("btnClear");
    const errorBanner = document.getElementById("errorBanner");
    const resultCard = document.getElementById("resultCard");
    const calorieText = document.getElementById("calorieText");
    const badgeCategory = document.getElementById("badgeCategory");
    const breakdownText = document.getElementById("breakdownText");

    function calculateCalories() {
      errorBanner.style.display = "none";

      const ageStr = ageInput.value.trim();
      const weightStr = weightInput.value.trim();

      if (!ageStr || !weightStr) {
        showError("Please enter both age and weight.");
        return;
      }

      const age = parseInt(ageStr, 10);
      const weight = parseFloat(weightStr);

      if (isNaN(age) || age < 1 || age > 120) {
        showError("Please enter a valid age between 1 and 120 years.");
        return;
      }

      if (isNaN(weight) || weight < 5 || weight > 400) {
        showError("Please enter a valid weight between 5 and 400 kg.");
        return;
      }

      const category = activityInput.value;
      let multiplier = 1.55;

      if (category === "Sedentary") {
        multiplier = 1.20;
      } else if (category === "Very Active") {
        multiplier = 1.725;
      } else {
        multiplier = 1.55;
      }

      // Standard Mifflin-St Jeor equation baseline:
      // BMR = (10 * weight) + (6.25 * 170) - (5 * age) - 78
      const standardHeightCm = 170.0;
      let bmr = (10.0 * weight) + (6.25 * standardHeightCm) - (5.0 * age) - 78.0;
      if (bmr < 500) bmr = 500;

      const dailyCalories = Math.round(bmr * multiplier);

      calorieText.textContent = `${dailyCalories.toLocaleString()} kcal / day`;
      badgeCategory.textContent = category;

      badgeCategory.className = "category-badge";
      if (category === "Sedentary") {
        badgeCategory.classList.add("badge-sedentary");
      } else if (category === "Very Active") {
        badgeCategory.classList.add("badge-very-active");
      } else {
        badgeCategory.classList.add("badge-moderate");
      }

      breakdownText.textContent = `Estimated BMR: ${Math.round(bmr).toLocaleString()} kcal • Multiplier: ${multiplier.toFixed(3)}x`;

      resultCard.style.display = "block";
    }

    function clearFields() {
      ageInput.value = "";
      weightInput.value = "";
      activityInput.value = "Moderately Active";
      resultCard.style.display = "none";
      errorBanner.style.display = "none";
      ageInput.focus();
    }

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = "block";
      resultCard.style.display = "none";
    }

    btnCalculate.addEventListener("click", calculateCalories);
    btnClear.addEventListener("click", clearFields);

    [ageInput, weightInput].forEach(input => {
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") calculateCalories();
      });
    });
  </script>
</body>
</html>
